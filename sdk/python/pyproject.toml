[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthos-sdk"
version = "0.1.0"
description = "Python SDK and CLI for the Synthos dataset validation platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Synthos" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
crypto = ["cryptography>=41"]  # offline certificate verification

[project.scripts]
synthos = "synthos.cli:main"

[tool.setuptools.packages.find]
include = ["synthos*"]
